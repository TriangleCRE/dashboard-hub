<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Triangle Investment Group — Dashboard Hub</title>
<link rel="stylesheet" href="/shared.css" />
<style>
  /* ---------- HUB-ONLY: card grid ---------- */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:22px 22px 20px;display:flex;flex-direction:column;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 2px 6px rgba(0,0,0,.08),0 14px 34px rgba(0,0,0,.10)}
  .card.pinned{
    background:var(--orange-tint);border:1.5px solid var(--orange);
    box-shadow:0 1px 3px rgba(232,134,58,.15), 0 8px 24px rgba(232,134,58,.12);
  }
  .pinned-badge{
    display:inline-block;font-size:11px;font-weight:700;color:#fff;
    background:var(--orange);border-radius:20px;padding:3px 10px;
    letter-spacing:.2px;flex:none;
  }
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
  .card-head-actions{display:flex;align-items:center;gap:8px;flex:none}
  .card .name{font-size:16.5px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
  .card .name .dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
  .card .desc{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 16px;flex:1}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-soft);margin-bottom:16px}
  .meta .k{font-weight:600;color:var(--ink)}
  .note-text{
    font-size:12.5px;color:var(--ink-soft);font-style:italic;
    line-height:1.4;margin-bottom:14px;
  }
  .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

  /* ---------- HUB-ONLY: the grouped "Billing Tools" tile ----------
     The per-property billing tools (Hoy, Harbor Freight, 211/213 N Lewis)
     render as one collapsible tile instead of three separate cards — see
     BILLING_TOOL_NAMES below. Collapsed by default; clicking the header
     expands it to a per-property list, each with its own "Open dashboard"
     link (and pencil, so editing a property's dashboard still works
     exactly like any other card). */
  .billing-tile-header{
    background:none;border:none;padding:0;font:inherit;color:inherit;
    text-align:left;width:100%;cursor:pointer;
  }
  .billing-tile-header:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:8px}
  .billing-chevron{
    display:inline-block;color:var(--ink-soft);font-size:13px;flex:none;
    transition:transform .15s ease;
  }
  .billing-tile.open .billing-chevron{transform:rotate(90deg)}
  .billing-list{display:flex;flex-direction:column;margin-top:2px}
  .billing-list[hidden]{display:none}
  .billing-item{padding:12px 0;border-top:1px solid var(--line)}
  .billing-item:first-child{border-top:none;padding-top:0}
  .billing-item-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .billing-item-name{font-size:14px;font-weight:700}
  .billing-item-meta{font-size:12px;color:var(--ink-soft);margin-bottom:8px}
  .billing-item-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
</style>
</head>
<body>

  <!-- ===================== APP ===================== -->
  <div id="app">
    <div class="accent-bar"></div>
    <header class="top">
      <div class="top-inner">
        <img id="topLogo" alt="Triangle Investment Group" />
        <div class="titles">
          <h1>Dashboard Hub</h1>
          <p>All Triangle Investment Group dashboards in one place</p>
        </div>
        <nav class="top-nav">
          <a href="/" class="top-nav-link active">Dashboards</a>
          <a href="/tracker" class="top-nav-link">Tracker</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="section-row">
        <div class="section-label">Dashboards</div>
        <button type="button" class="btn btn-add" id="openAddDashboard">+ Add Dashboard</button>
      </div>
      <div class="toolbar">
        <div class="search-wrap">
          <input type="search" id="searchInput" placeholder="Search dashboards…" aria-label="Search dashboards" />
        </div>
        <div class="toolbar-controls">
          <label class="toolbar-label" for="sortSelect">Sort</label>
          <select id="sortSelect" aria-label="Sort dashboards">
            <option value="name-asc">Name (A–Z)</option>
            <option value="name-desc">Name (Z–A)</option>
            <option value="updated-desc">Last updated (newest)</option>
            <option value="updated-asc">Last updated (oldest)</option>
          </select>
          <label class="toolbar-label" for="filterSelect">Show</label>
          <select id="filterSelect" aria-label="Filter dashboards">
            <option value="all">All dashboards</option>
            <option value="pinned">Pinned only</option>
            <option value="walkthrough">Has walkthrough</option>
          </select>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </main>

  </div>

  <!-- ===================== ADD / EDIT DASHBOARD MODAL ===================== -->
  <!-- Shared verbatim with tracker.html (same ids) — see public/shared.js. -->
  <div class="modal-overlay" id="addModalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
      <h2 id="addModalTitle">Add Dashboard</h2>
      <p class="sub" id="addModalSub">Add a link to another Triangle Investment Group dashboard.</p>
      <p class="form-error" id="addModalError"></p>
      <form id="addDashboardForm">
        <div class="field">
          <label for="fieldName">Name</label>
          <input type="text" id="fieldName" maxlength="80" required />
        </div>
        <div class="field">
          <label for="fieldUrl">URL</label>
          <input type="text" id="fieldUrl" placeholder="https://" maxlength="500" required />
        </div>

        <div class="modal-section-label">Shown on the Hub</div>
        <div class="field">
          <label for="fieldDesc">Description <span class="hint">(optional)</span></label>
          <textarea id="fieldDesc" maxlength="200"></textarea>
        </div>
        <div class="field">
          <label for="fieldSitePassword">Site password <span class="hint">(optional)</span></label>
          <input type="text" id="fieldSitePassword" maxlength="80" />
        </div>
        <div class="field">
          <label for="fieldNote">Note <span class="hint">(optional)</span></label>
          <input type="text" id="fieldNote" maxlength="80" />
        </div>
        <div class="field">
          <label for="fieldWalkthrough">Walkthrough link <span class="hint">(optional)</span></label>
          <input type="text" id="fieldWalkthrough" placeholder="https://" maxlength="500" />
        </div>

        <div class="modal-section-label">Tracked on the Tracker</div>
        <div class="field">
          <label for="fieldLastUpdated">Last updated <span class="hint">(optional — any format, e.g. "Aug 5, 2026")</span></label>
          <input type="text" id="fieldLastUpdated" maxlength="40" />
        </div>
        <div class="field">
          <label for="fieldNextUpdateDue">Next update due <span class="hint">(optional — any format, e.g. "Sep 1, 2026", or "As needed")</span></label>
          <input type="text" id="fieldNextUpdateDue" maxlength="40" />
        </div>
        <div class="field">
          <label for="fieldOwner">Owner <span class="hint">(the one person who edits this in Claude Code)</span></label>
          <input type="text" id="fieldOwner" maxlength="80" />
        </div>
        <div class="field">
          <label for="fieldSources">Sources to update it <span class="hint">(optional — shown in a pop-up on the Tracker)</span></label>
          <textarea id="fieldSources" maxlength="3000" placeholder="e.g. Rent roll export from AppFolio, bank statements from Chase"></textarea>
        </div>
        <div class="field">
          <label for="fieldInstructions">Instructions to update it <span class="hint">(optional — shown in a pop-up on the Tracker)</span></label>
          <textarea id="fieldInstructions" maxlength="3000" placeholder="e.g. Use the &quot;Add Property&quot; feature on the dashboard"></textarea>
        </div>

        <div class="modal-actions" id="modalActionsRow">
          <button type="button" class="btn-remove" id="deleteDashboard" hidden>Delete Dashboard</button>
          <a class="btn btn-ghost" id="cancelAddDashboard" href="javascript:void(0)">Cancel</a>
          <button type="submit" class="btn" id="submitAddDashboard">Add Dashboard</button>
        </div>
        <div class="delete-confirm" id="deleteConfirmRow" hidden>
          <p class="delete-confirm-text">Delete this dashboard for everyone? This can't be undone.</p>
          <div class="delete-confirm-actions">
            <button type="button" id="deleteConfirmNo">Never mind</button>
            <button type="button" id="deleteConfirmYes">Yes, delete it</button>
          </div>
        </div>
      </form>
    </div>
  </div>

<script src="/shared.js"></script>
<script>
  /* =========================================================================
     TRIANGLE DASHBOARD HUB
     -------------------------------------------------------------------------
     The dashboard list itself lives in Postgres (see src/db.js), not in this
     file — it's fetched from /api/dashboards. Use the "+ Add Dashboard"
     button and each card's pencil icon to manage the list; there's nothing
     to hand-edit here anymore. See public/shared.js for the API helpers and
     the Add/Edit modal (shared with tracker.html), and public/tracker.html
     for the ownership/schedule/sources view over this same list.
     ========================================================================= */
  document.getElementById("topLogo").src = LOGO;

  const grid = document.getElementById("grid");

  function renderMessage(text){
    grid.innerHTML = `<p class="grid-message">${esc(text)}</p>`;
  }

  /* =========================================================================
     SEARCH / SORT / FILTER
     -------------------------------------------------------------------------
     Purely client-side over whatever the API last returned — `allSites` is
     the untouched list, everything below derives a view of it. Re-run on
     every keystroke/select change; no need to re-fetch just to re-order or
     narrow what's already in memory.
     ========================================================================= */
  let allSites = [];
  const searchInput = document.getElementById("searchInput");
  const sortSelect = document.getElementById("sortSelect");
  const filterSelect = document.getElementById("filterSelect");

  /* =========================================================================
     BILLING TOOLS TILE
     -------------------------------------------------------------------------
     These three are still just regular rows in the `dashboards` table (see
     src/db.js) — each with its own owner, checklist, sources, etc. on the
     Tracker. This only changes how the Hub *displays* them: grouped into
     one tile instead of three separate cards. Matched by name (there's no
     "billing tool" flag in the data) — same name-matching pattern the
     Tracker's own migrations already rely on for these exact three rows.
     ========================================================================= */
  const BILLING_TOOL_NAMES = [
    "Hoy Billing Tool",
    "Harbor Freight Billing Tool",
    "211/213 N Lewis Billing Tool",
  ];

  // Collapsed by default — expanding is the "click to see each individual
  // dashboard" step the tile exists for. Lives outside renderCards() so it
  // survives the full re-render every search keystroke/sort/filter change
  // triggers (rather than resetting closed on every one of those).
  let billingTileOpen = false;

  // A synthetic "site" standing in for the grouped rows above wherever the
  // rest of this file expects one — sortSites() in particular needs `name`/
  // `pinned`/lastUpdated-shaped input to place it correctly, same as any
  // real dashboard.
  function buildBillingTile(children){
    const latest = children.reduce(
      (best, c) => (updatedTime(c) > updatedTime(best) ? c : best),
      children[0]
    );
    return {
      isBillingGroup: true,
      id: "billing-tools-group",
      name: "Billing Tools",
      pinned: false,
      lastUpdated: latest.lastUpdated,
      children,
    };
  }

  function matchesSearch(site, query){
    if (!query) return true;
    const haystack = [site.name, site.desc, site.note].filter(Boolean).join(" \n ").toLowerCase();
    return haystack.includes(query);
  }

  function filterSites(sites){
    const query = searchInput.value.trim().toLowerCase();
    const filter = filterSelect.value;
    return sites.filter(s => {
      if (filter === "pinned" && !s.pinned) return false;
      if (filter === "walkthrough" && !s.walkthrough) return false;
      return matchesSearch(s, query);
    });
  }

  // Best-effort: freeform "last updated" text (e.g. "Aug 5, 2026") parsed as
  // a date when possible. Unparseable/empty values sort to the bottom of
  // "newest first" and the top of "oldest first" either way, rather than
  // throwing off the rest of the ordering.
  function updatedTime(site){
    if (!site.lastUpdated) return -Infinity;
    const t = Date.parse(site.lastUpdated);
    return isNaN(t) ? -Infinity : t;
  }

  function sortSites(sites){
    const sorted = sites.slice();
    const byNameAsc = (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" });
    // The chosen sort mode only decides order *within* the pinned group and
    // *within* the rest — pinned dashboards always come first, no matter
    // which mode is active (so there's no separate "Pinned first" option;
    // every mode already behaves that way).
    let cmp;
    switch (sortSelect.value) {
      case "name-desc":
        cmp = (a, b) => byNameAsc(b, a);
        break;
      case "updated-desc":
        cmp = (a, b) => updatedTime(b) - updatedTime(a) || byNameAsc(a, b);
        break;
      case "updated-asc":
        cmp = (a, b) => updatedTime(a) - updatedTime(b) || byNameAsc(a, b);
        break;
      case "name-asc":
      default:
        cmp = byNameAsc;
        break;
    }
    sorted.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || cmp(a, b));
    return sorted;
  }

  function applyFiltersAndRender(){
    if (!allSites.length) return; // handled by the "no dashboards yet" message
    const filtered = filterSites(allSites);
    if (!filtered.length) {
      renderMessage("No dashboards match your search/filter.");
      return;
    }
    // Pull the billing tools out of the normal card list and fold them into
    // one synthetic tile (see buildBillingTile above) before sorting — so
    // e.g. searching "Hoy" still surfaces the tile with just that one
    // property inside it, rather than the tile being all-or-nothing.
    const billingSites = filtered.filter(s => BILLING_TOOL_NAMES.includes(s.name));
    const rest = filtered.filter(s => !BILLING_TOOL_NAMES.includes(s.name));
    const displaySites = billingSites.length ? [...rest, buildBillingTile(billingSites)] : rest;
    renderCards(sortSites(displaySites));
  }

  searchInput.addEventListener("input", applyFiltersAndRender);
  sortSelect.addEventListener("change", applyFiltersAndRender);
  filterSelect.addEventListener("change", applyFiltersAndRender);

  function renderCard(s){
    const meta = [];
    if (s.lastUpdated) meta.push(`<span><span class="k">Last updated:</span> ${esc(s.lastUpdated)}</span>`);
    const metaHtml = meta.length ? `<div class="meta">${meta.join("")}</div>` : "";
    const pill = s.sitePassword
      ? `<div style="margin-bottom:14px"><span class="pill">Site password: ${esc(s.sitePassword)}</span></div>` : "";
    const noteText = s.note ? `<div class="note-text">${esc(s.note)}</div>` : "";
    const walk = s.walkthrough
      ? `<a class="btn btn-ghost" href="${esc(s.walkthrough)}" target="_blank" rel="noopener">▶ Walkthrough</a>` : "";
    const pinnedBadge = s.pinned ? `<span class="pinned-badge">★ Start here</span>` : "";
    return `
      <div class="card${s.pinned ? " pinned" : ""}">
        <div class="card-head">
          <div class="name"><span class="dot"></span>${esc(s.name)}</div>
          <div class="card-head-actions">
            ${pinnedBadge}
            <button type="button" class="icon-btn" data-edit-id="${s.id}" title="Edit" aria-label="Edit ${esc(s.name)}">✎</button>
          </div>
        </div>
        <div class="desc">${esc(s.desc)}</div>
        ${metaHtml}
        ${pill}
        ${noteText}
        <div class="actions">
          <a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">Open dashboard →</a>
          ${walk}
        </div>
      </div>`;
  }

  // One property's row inside the expanded Billing Tools tile — same
  // "Open dashboard"/walkthrough/site-password/edit affordances a regular
  // card has, just laid out compactly since several sit inside one tile.
  function renderBillingItem(s){
    const metaHtml = s.lastUpdated
      ? `<div class="billing-item-meta"><span class="k">Last updated:</span> ${esc(s.lastUpdated)}</div>` : "";
    const pill = s.sitePassword
      ? `<span class="pill">Site password: ${esc(s.sitePassword)}</span>` : "";
    const walk = s.walkthrough
      ? `<a class="btn btn-ghost" href="${esc(s.walkthrough)}" target="_blank" rel="noopener">▶ Walkthrough</a>` : "";
    return `
      <div class="billing-item">
        <div class="billing-item-head">
          <div class="billing-item-name">${esc(s.name)}</div>
          <button type="button" class="icon-btn" data-edit-id="${s.id}" title="Edit" aria-label="Edit ${esc(s.name)}">✎</button>
        </div>
        ${metaHtml}
        <div class="billing-item-actions">
          <a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">Open dashboard →</a>
          ${walk}
          ${pill}
        </div>
      </div>`;
  }

  function renderBillingTile(group){
    const count = group.children.length;
    return `
      <div class="card billing-tile${billingTileOpen ? " open" : ""}">
        <button type="button" class="card-head billing-tile-header" data-billing-toggle aria-expanded="${billingTileOpen}">
          <div class="name"><span class="dot"></span>Billing Tools</div>
          <div class="card-head-actions">
            <span class="pill">${count} propert${count === 1 ? "y" : "ies"}</span>
            <span class="billing-chevron" aria-hidden="true">▸</span>
          </div>
        </button>
        <div class="desc">Billing tools for individual properties. Click to open each one.</div>
        <div class="billing-list" ${billingTileOpen ? "" : "hidden"}>
          ${group.children.map(renderBillingItem).join("")}
        </div>
      </div>`;
  }

  function renderCards(sites){
    grid.innerHTML = sites.map(s => s.isBillingGroup ? renderBillingTile(s) : renderCard(s)).join("");

    // Looks up against allSites (the untouched full list), not the `sites`
    // passed in here — a billing tool's edit pencil lives inside the
    // synthetic tile now, not as its own top-level entry in `sites`.
    grid.querySelectorAll("[data-edit-id]").forEach(btn => {
      btn.addEventListener("click", () => {
        const site = allSites.find(s => String(s.id) === btn.getAttribute("data-edit-id"));
        if (site) modal.openEditModal(site);
      });
    });

    const billingToggle = grid.querySelector("[data-billing-toggle]");
    if (billingToggle) {
      billingToggle.addEventListener("click", () => {
        billingTileOpen = !billingTileOpen;
        applyFiltersAndRender();
      });
    }
  }

  async function loadAndRender(){
    renderMessage("Loading dashboards…");
    try {
      const sites = await apiRequest(API_BASE);
      allSites = sites;
      if (!sites.length) {
        renderMessage("No dashboards yet — use “+ Add Dashboard” to add the first one.");
        return;
      }
      applyFiltersAndRender();
    } catch (err) {
      grid.innerHTML = `<p class="grid-message">Couldn't load dashboards (${esc(err.message)}). <a href="javascript:void(0)" id="retryLoad">Retry</a></p>`;
      const retry = document.getElementById("retryLoad");
      if (retry) retry.addEventListener("click", loadAndRender);
    }
  }

  const modal = initDashboardModal(loadAndRender);
  document.getElementById("openAddDashboard").addEventListener("click", modal.openAddModal);

  loadAndRender();
</script>
</body>
</html>
